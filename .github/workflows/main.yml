name: Build LordVCAM Bypass .deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git make fakeroot rsync zip curl xz-utils \
            clang lld python3

      - name: Instalar ldid
        run: |
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 \
            -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid

      - name: Instalar Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          cd $THEOS
          git submodule init
          git config submodule.vendor/toolchain.update none
          git submodule update --recursive --depth 1 2>/dev/null || true

      - name: Configurar toolchain
        run: |
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          CLANG=$(which clang || which clang-17 || which clang-16)
          CLANGPP=$(which clang++ || which clang++-17 || which clang++-16)
          ln -sf $CLANG   $THEOS/toolchain/linux/iphone/bin/clang
          ln -sf $CLANGPP $THEOS/toolchain/linux/iphone/bin/clang++
          for tool in ar nm ranlib strip; do
            ln -sf $(which $tool) $THEOS/toolchain/linux/iphone/bin/$tool 2>/dev/null || true
          done
          ln -sf $(which ld.lld 2>/dev/null || which ld) $THEOS/toolchain/linux/iphone/bin/ld 2>/dev/null || true
          echo "Toolchain:"
          ls $THEOS/toolchain/linux/iphone/bin/
          $THEOS/toolchain/linux/iphone/bin/clang --version

      - name: Baixar iOS SDK (versao mais recente)
        run: |
          mkdir -p $THEOS/sdks
          # Usar Python para pegar a URL do SDK com versao mais alta
          SDK_URL=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "
          import sys, json, re
          data = json.load(sys.stdin)
          assets = [a['browser_download_url'] for a in data.get('assets', [])
                    if 'iPhoneOS' in a.get('name','') and a['name'].endswith('.tar.xz')]
          def ver(u):
              m = re.search(r'iPhoneOS([\d.]+)', u)
              if not m: return (0,)
              parts = [p for p in m.group(1).split('.') if p.isdigit()]
              return tuple(int(x) for x in parts) if parts else (0,)
          assets.sort(key=ver)
          print(assets[-1] if assets else '')
          ")
          echo "SDK URL: $SDK_URL"
          curl -fL "$SDK_URL" -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks/
          echo "SDK instalado:"
          ls $THEOS/sdks/
          # Fix 1: module.map -> module.modulemap (clang moderno)
          find $THEOS/sdks -name "module.map" -type f | while read f; do
            mv "$f" "$(dirname $f)/module.modulemap"
          done

          # Fix 2: remover _LIBCPP_USING_IF_EXISTS (extensao Apple nao suportada pelo clang do Ubuntu)
          # Este atributo causa "reference to unresolved using declaration" com clang padrao
          find $THEOS/sdks -name "cstddef" -path "*/c++/*" -type f | while read f; do
            sed -i 's/ _LIBCPP_USING_IF_EXISTS//g' "$f"
            echo "Patched cstddef: $f"
          done
          # Patch geral em todos os headers libc++ afetados
          find $THEOS/sdks -path "*/usr/include/c++/*" -name "*.h" -type f | \
            xargs grep -l "_LIBCPP_USING_IF_EXISTS" 2>/dev/null | while read f; do
            sed -i 's/ _LIBCPP_USING_IF_EXISTS//g' "$f"
          done
          echo "SDK patches aplicados"

      - name: Compilar tweak
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
        env:
          ARCHS: "arm64 arm64e"
          CFLAGS: "-Wno-deprecated-module-dot-map -Wno-error -Wno-everything"

      - name: Listar pacotes
        run: ls -la packages/ 2>/dev/null || echo "Sem pacotes"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: LordVCAMBypass-deb
          path: packages/*.deb
          retention-days: 30
