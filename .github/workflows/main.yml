name: Build LordVCAM Bypass .deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Permite rodar manualmente pelo site

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential git make fakeroot rsync zip curl xz-utils

      - name: Instalar ldid
        run: |
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 \
            -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          ldid 2>/dev/null || true
          echo "ldid instalado"

      - name: Instalar Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "Theos instalado em $THEOS"

      - name: Baixar iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          # Buscar URL dinamicamente da ultima release
          SDK_URL=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest \
            | grep browser_download_url \
            | grep "iPhoneOS" \
            | head -1 \
            | cut -d'"' -f4)
          echo "SDK URL: $SDK_URL"
          curl -fL "$SDK_URL" -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Compilar tweak
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
        working-directory: .

      - name: Listar pacotes gerados
        run: ls -la packages/

      - name: Upload .deb como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LordVCAMBypass-deb
          path: packages/*.deb
          retention-days: 30
