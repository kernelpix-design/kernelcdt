name: Build LordVCAM Bypass .deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macOS usa o clang da Apple - compativel com iOS SDK nativamente
    runs-on: macos-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ldid
        run: |
          brew install ldid 2>/dev/null || \
          curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macos_universal \
            -o /usr/local/bin/ldid && chmod +x /usr/local/bin/ldid
          ldid 2>/dev/null || true
          echo "ldid: OK"

      - name: Instalar Theos
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          sudo chmod -R 755 $THEOS
          echo "Theos: OK"

      - name: Baixar iOS SDK
        run: |
          sudo mkdir -p $THEOS/sdks
          SDK_URL=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "
          import sys, json, re
          data = json.load(sys.stdin)
          assets = [a['browser_download_url'] for a in data.get('assets', [])
                    if 'iPhoneOS' in a.get('name','') and a['name'].endswith('.tar.xz')]
          def ver(u):
              m = re.search(r'iPhoneOS([\d.]+)', u)
              if not m: return (0,)
              parts = [p for p in m.group(1).split('.') if p.isdigit()]
              return tuple(int(x) for x in parts) if parts else (0,)
          assets.sort(key=ver)
          print(assets[-1] if assets else '')
          ")
          echo "SDK URL: $SDK_URL"
          curl -fL "$SDK_URL" -o /tmp/sdk.tar.xz
          sudo tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks/
          echo "SDK instalado:"
          ls $THEOS/sdks/

      - name: Compilar tweak
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
        env:
          ARCHS: "arm64 arm64e"

      - name: Listar pacotes
        run: ls -la packages/ 2>/dev/null || echo "Sem packages"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: LordVCAMBypass-deb
          path: packages/*.deb
          retention-days: 30
