name: Build LordVCAM Bypass .deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # macOS usa o clang da Apple - compativel com iOS SDK nativamente
    runs-on: macos-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar ldid
        run: |
          brew install ldid
          echo "ldid: $(which ldid)"

      - name: Instalar Theos
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          sudo chmod -R 755 $THEOS
          echo "Theos: OK"

      - name: Baixar iOS SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo mkdir -p $THEOS/sdks
          # Usar token para evitar rate limit da API GitHub
          SDK_URL=$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/theos/sdks/releases/latest | python3 -c "
          import sys, json, re
          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except Exception as e:
              print('JSON error:', e, file=sys.stderr)
              print('Response:', raw[:200], file=sys.stderr)
              sys.exit(1)
          assets = [a['browser_download_url'] for a in data.get('assets', [])
                    if 'iPhoneOS' in a.get('name','') and a['name'].endswith('.tar.xz')]
          def ver(u):
              m = re.search(r'iPhoneOS([\d.]+)', u)
              if not m: return (0,)
              parts = [p for p in m.group(1).split('.') if p.isdigit()]
              return tuple(int(x) for x in parts) if parts else (0,)
          assets.sort(key=ver)
          print(assets[-1] if assets else '')
          ")
          echo "SDK URL: $SDK_URL"
          curl -fL -H "Authorization: token $GH_TOKEN" "$SDK_URL" -o /tmp/sdk.tar.xz
          sudo tar -xJf /tmp/sdk.tar.xz -C $THEOS/sdks/
          echo "SDK instalado:"
          ls $THEOS/sdks/

      - name: Compilar tweak
        run: |
          chmod +x postinst 2>/dev/null || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
        env:
          ARCHS: "arm64 arm64e"

      - name: Listar pacotes
        run: ls -la packages/ 2>/dev/null || echo "Sem packages"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: LordVCAMBypass-deb
          path: packages/*.deb
          retention-days: 30
